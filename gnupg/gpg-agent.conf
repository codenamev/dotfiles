# Cache passphrases for 8h since last use, and at most 24h after entry.
# gpg config files don't allow trailing comments, so keep them on their own lines.
default-cache-ttl 28800
max-cache-ttl 86400

# Use the macOS pinentry so the passphrase can be saved in Keychain.
pinentry-program /opt/homebrew/bin/pinentry-mac
